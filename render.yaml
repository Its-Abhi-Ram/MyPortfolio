services:
  - type: web
    name: portfolio-contact-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        sync: false
